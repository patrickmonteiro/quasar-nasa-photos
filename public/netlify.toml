[[headers]]
  for = "/service-worker.js"
  [headers.values]
  cache-control = '''
  max-age=0,
  no-cache,
  must-revalidate'''

[images]
  remote_images = [
    "https://mars.nasa.gov/.*",
    "http://mars.nasa.gov/.*",
    "https://mars.jpl.nasa.gov/.*",
    "http://mars.jpl.nasa.gov/.*",
    "https://planetarydata.jpl.nasa.gov/.*"
  ]
